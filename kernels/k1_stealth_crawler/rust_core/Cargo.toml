[package]
name = "bl_crawler"
version = "0.1.0"
edition = "2021"

[lib]
name = "bl_crawler"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["rustls-tls", "gzip", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
